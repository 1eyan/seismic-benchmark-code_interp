# ---------------------------------------------------------------------------
# Pan et al. 2020 — PConv U-Net smoke test (dataflow / loss / checkpoint)
#
# Minimal 2-epoch, 10-step-per-epoch run for quick verification that the
# model, loss, data pipeline, and checkpoint I/O work end-to-end.
# Do NOT use for benchmarking or paper results.
# ---------------------------------------------------------------------------

experiment:
  name: interp_pan2020_pconv_smoke
  output_dir: results
  seed: 42
  device: cuda

data:
  segy:
    path: /NAS/czt/mount/chengzhitong/data/SEGC3/SEG_45Shot_shots1-9.sgy
    traces_per_shot: 201
    time_downsample: 1
  test_ratio: 0.1
  loader:
    batch_size: 2             # tiny batch for smoke test
    num_workers: 0
    pin_memory: true

preprocess:
  mask_mode: pan2020_random
  dt: 0.002
  t0: 0.0
  spherical_power: 1.2
  normalize_mode: minmax
  normalize_scope: global
  patch_time: 128
  patch_trace: 128
  patch_overlap: 0.5
  max_shots: 1               # single shot only
  skip: []

model:
  type: pan2020_pconv_unet
  params:
    in_channels: 1
    out_channels: 1
    encoder_channels: [8, 16, 32, 64, 64, 64]    # tiny for smoke
    encoder_kernels: [7, 5, 5, 3, 3, 3]
    decoder_channels: [64, 32, 16, 8, 4, 1]       # tiny for smoke
    normalization_mode: author_global_mask_mean
    upsample_mode: nearest
    output_activation: sigmoid
    leaky_relu_slope: 0.2
    input_mode: separate
    zero_valid_policy: error

loss:
  type: pan2020_pconv_composite
  params:
    hole_weight: 6.0
    tv_weight: 0.1
    tv_dilation: 7

metrics:
  - name: mae
    params: {}

optim:
  type: adam
  params:
    lr: 2.0e-4

scheduler:
  type: none
  params: {}

train:
  epochs: 2                  # minimal
  grad_clip: null
  log_step: true
  log_interval: 5
  eval_interval: 1
  ckpt_interval: 1
  vis_interval: 1
  resume: null

log:
  log_dir: logs
  plot_interval: 1
