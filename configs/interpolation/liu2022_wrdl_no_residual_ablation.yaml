# ---------------------------------------------------------------------------
# Liu et al. 2022 — WRDL no-residual ablation
#
# Same WRDL architecture but with bottleneck_blocks=0 to isolate the effect
# of the bottleneck residual blocks.  All other parameters match the
# conservative profile.
#
# NOT for performance evaluation — ablation only.
# ---------------------------------------------------------------------------

experiment:
  name: interp_liu2022_wrdl_no_residual
  output_dir: results
  seed: 42
  device: cuda

data:
  segy:
    path: /NAS/czt/mount/chengzhitong/data/SEGC3/SEG_45Shot_shots1-9.sgy
    traces_per_shot: 201
    time_downsample: 1
  test_ratio: 0.1
  loader:
    batch_size: 4
    num_workers: 4
    pin_memory: true

preprocess:
  mask_mode: continuous
  mask_ratio: 0.2
  dt: 0.002
  t0: 0.0
  spherical_power: 1.2
  normalize_mode: max_abs
  normalize_scope: global
  patch_time: 128
  patch_trace: 128
  patch_overlap: 0.5
  max_shots: null
  skip: []

model:
  type: liu2022_wrdl
  params:
    in_channels: 1
    out_channels: 1
    encoder_channels: [32, 64, 128, 256, 512]
    bottleneck_channels: 512
    bottleneck_blocks: 0         # <-- ablation: no residual blocks
    bottleneck_ratio: 4
    wavelet: haar
    subband_order: ll_lh_hl_hh
    output_activation: none

loss:
  type: wrdl_ssim_huber
  params:
    ssim_weight: 1.0
    huber_weight: 1.0
    huber_delta: 1.0
    window_size: 11
    window_sigma: 1.5
    data_range: 2.0

metrics:
  - name: snr
    params: { reduction: per_sample }
  - name: ssim
    params: { data_range: 2.0, window_size: 11, sigma: 1.5 }
  - name: mae
    params: {}

optim:
  type: adam
  params:
    lr: 1.0e-3

scheduler:
  type: cosine
  params:
    min_lr: 1.0e-6

train:
  epochs: 100
  eval_interval: 2
  ckpt_interval: 10
  vis_interval: 10
  log_interval: 20
  log_step: false

log:
  log_dir: logs
  plot_interval: 5
