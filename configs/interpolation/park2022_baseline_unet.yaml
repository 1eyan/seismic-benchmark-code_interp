# ---------------------------------------------------------------------------
# Park et al. 2022 — baseline: single UNet with MSE loss
#
# Ablation baseline matching the paper's "UNet with the MSE" comparison
# (Tables IV-V).  Uses the in-repo UNet with the same channel budget as the
# CFunet coarse network (22 -> 44 -> 88 -> 176 -> 352), the same
# cfunet_random masking, Adam lr 5e-5, batch 32 and 20 epochs.  Mask-aware
# baseline: the plain UNet ignores the observed mask.
# ---------------------------------------------------------------------------

experiment:
  name: interp_park2022_baseline_unet
  output_dir: results
  seed: 42
  device: cuda:0

data:
  segy:
    path: /NAS/czt/mount/chengzhitong/data/SEGC3/SEG_45Shot_shots1-9.sgy
    traces_per_shot: 201
    time_downsample: 1
  test_ratio: 0.1
  loader:
    batch_size: 128
    num_workers: 4
    pin_memory: true

preprocess:
  mask_mode: cfunet_random
  mask_ratio_range: [0.5, 0.875]
  dt: 0.002
  t0: 0.0
  spherical_power: 1.2
  normalize_mode: max_abs
  normalize_scope: global
  patch_normalize: true
  patch_norm_eps: 1.0e-6
  patch_time: 128
  patch_trace: 128
  patch_overlap: 0.5
  max_shots: null

model:
  type: unet
  params:
    in_channels: 1
    out_channels: 1
    base_channels: 22        # matches CFunet coarse network budget
    depth: 4

loss:
  type: mse
  params: {}

metrics:
  - name: snr
    params: { reduction: per_sample }
  - name: ssim
    params: { data_range: 2.0, window_size: 11, sigma: 1.5 }
  - name: mae
    params: {}
  - name: mse
    params: {}

optim:
  type: adam
  params:
    lr: 5.0e-5
    betas: [0.9, 0.999]
    weight_decay: 0.0

scheduler:
  type: none
  params: {}

train:
  epochs: 20
  eval_interval: 1
  ckpt_interval: 5
  vis_interval: 5
  log_interval: 20
  log_step: false
  grad_clip: null

log:
  log_dir: logs
  plot_interval: 1

paper_alignment:
  baseline: paper-explicit comparison target ("UNet with the MSE")
  architecture: repository-adaptation (in-repo UNet, same channel budget as
    the CFunet coarse network; paper baseline details not specified)
  masking: same cfunet_random protocol as the CFunet configs
  loss: paper-explicit (MSE only)
  other: identical to park2022_cfunet_paper.yaml training settings
