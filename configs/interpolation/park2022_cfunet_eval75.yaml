# ---------------------------------------------------------------------------
# Park et al. 2022 — CFunet fixed-75% validation protocol
#
# The paper trains with random 50%-87.5% trace removal but validates and
# tests with a fixed 75% missing ratio.  This config pins
# ``mask_ratio_range`` to [0.75, 0.75] so every validation patch loses
# exactly 75% of its traces.  Use it for paper-style evaluation runs;
# otherwise identical to park2022_cfunet_paper.yaml.
# ---------------------------------------------------------------------------

experiment:
  name: interp_park2022_cfunet_eval75
  output_dir: results
  seed: 42
  device: cuda:1

data:
  segy:
    path: /NAS/czt/mount/chengzhitong/data/SEGC3/SEG_45Shot_shots1-9.sgy
    traces_per_shot: 201
    time_downsample: 1
  test_ratio: 0.1
  loader:
    batch_size: 32
    num_workers: 4
    pin_memory: true

preprocess:
  mask_mode: cfunet_random
  mask_ratio_range: [0.75, 0.75]   # paper-explicit (fixed 75% validation)
  dt: 0.002
  t0: 0.0
  spherical_power: 1.2
  normalize_mode: max_abs
  normalize_scope: global
  patch_normalize: true
  patch_norm_eps: 1.0e-6
  patch_time: 128
  patch_trace: 128
  patch_overlap: 0.5
  max_shots: null

model:
  type: park2022_cfunet
  params:
    in_channels: 1
    out_channels: 1
    base_channels: 22
    num_levels: 4
    upsample_mode: fourier_zero_padding
    upsampler_scale_factor: 2
    use_fftshift: true
    fft_norm: backward
    amplitude_correction: scale

loss:
  type: cfunet_mse_fourier
  params:
    alpha: 1.0
    fft_norm: backward

metrics:
  - name: snr
    params: { reduction: per_sample }
  - name: ssim
    params: { data_range: 2.0, window_size: 11, sigma: 1.5 }
  - name: mae
    params: {}
  - name: mse
    params: {}

optim:
  type: adam
  params:
    lr: 5.0e-5
    betas: [0.9, 0.999]
    weight_decay: 0.0

scheduler:
  type: none
  params: {}

train:
  epochs: 20
  eval_interval: 1
  ckpt_interval: 5
  vis_interval: 5
  log_interval: 20
  log_step: false
  grad_clip: null

log:
  log_dir: logs
  plot_interval: 1

paper_alignment:
  mask_ratio_validation: paper-explicit (fixed 75%, pinned via [0.75, 0.75])
  other: identical to park2022_cfunet_paper.yaml paper_alignment block
