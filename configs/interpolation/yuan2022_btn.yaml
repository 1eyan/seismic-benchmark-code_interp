# ---------------------------------------------------------------------------
# Yuan et al. 2022 — Blind-Trace Network for seismic interpolation
#
# The BTN enforces a strict receptive-field constraint: the prediction for
# trace j cannot access the input at trace j.  Two half-plane U-Net branches
# (rotated 90 and 270 degrees) process left-context and right-context
# independently, followed by 1x1 convolution fusion.
#
# Conservative reproduction profile:
#   4-level HalfSidedBlindUNet, base_channels=32, kernel_size=3,
#   encoder/bottleneck norm=none, decoder norm=batch, nearest upsampling,
#   shared branch weights, LeakyReLU(0.01).
# ---------------------------------------------------------------------------

experiment:
  name: interp_yuan2022_btn_paper
  output_dir: results
  seed: 42
  device: cuda

data:
  segy:
    path: /NAS/czt/mount/chengzhitong/data/SEGC3/SEG_45Shot_shots1-9.sgy
    traces_per_shot: 201
    time_downsample: 1
  test_ratio: 0.1
  loader:
    batch_size: 192
    num_workers: 4
    pin_memory: true

preprocess:
  mask_mode: continuous
  mask_ratio: 0.1
  dt: 0.002
  t0: 0.0
  spherical_power: 1.2
  uniform_stride: 2
  normalize_mode: max_abs
  normalize_scope: global
  patch_normalize: true
  patch_norm_eps: 1.0e-6
  patch_time: 256
  patch_trace: 128
  patch_overlap: 0.5
  max_shots: null

model:
  type: yuan2022_btn
  params:
    in_channels: 1
    out_channels: 1
    base_channels: 32
    num_levels: 4
    kernel_size: 3
    encoder_norm: none
    decoder_norm: batch
    activation: relu
    upsample_mode: nearest
    share_branch_weights: true
    conv_bias: true
    negative_slope: 0.01
    num_groups: 8

loss:
  type: mse
  params:
    reduction: mean

metrics:
  - name: snr
    params: { reduction: per_sample }
  - name: psnr
    params: { data_range: 1.0, reduction: per_sample }
  - name: ssim
    params: { data_range: 2.0, window_size: 11, sigma: 1.5 }
  - name: mse
    params: {}

optim:
  type: adamw
  params:
    lr: 1.0e-3
    weight_decay: 1.0e-4

scheduler:
  type: cosine
  params:
    min_lr: 1.0e-6

train:
  epochs: 200
  grad_clip: 1.0
  log_step: false
  log_interval: 20
  eval_interval: 1
  ckpt_interval: 5
  vis_interval: 5
  resume: null

log:
  log_dir: logs
  plot_interval: 5

inference:
  data:
    segy:
      path: /NAS/czt/mount/chengzhitong/data/SEGC3/SEG_45Shot_shots10-18.sgy
      traces_per_shot: 201
      time_downsample: 1
  checkpoint: results/interp_yuan2022_btn_paper/checkpoints/epoch_0200.pt
  output_dir: results/interp_yuan2022_btn_paper/inference
  n_viz_shots: 5
  device: 1
  batch_size: 4
