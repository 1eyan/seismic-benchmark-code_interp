experiment:
  name: interp_hf_vit_base
  output_dir: results       # Relative to repo root, or absolute (e.g., /data/experiments)
  seed: 42
  device: cuda

data:
  # Supported formats: segy, npy, mat (pick one block)
  segy:
    path: /NAS/czt/mount/chengzhitong/data/SEGC3/SEG_45Shot_shots1-9.sgy
    traces_per_shot: 201
    time_downsample: 1
  # npy:
  #   path: /data/shared/SEGC3/SEG_45Shot_shots1-9.npy
  # mat:
  #   path: /data/shared/SEGC3/SEG_45Shot_shots1-9.mat
  #   key: shots   # optional variable name
  # Shot-level split: uncomment to split by FFID instead of patch-level random split.
  # shot_split:
  #   train: 7
  #   val: 1
  #   test: 1
  test_ratio: 0.1
  loader:
    batch_size: 16           # ViT has more params, use smaller batch
    num_workers: 4
    pin_memory: true

preprocess:
  mask_mode: continuous
  mask_ratio: 0.1
  # continuous_missing_traces: 20
  dt: 0.002
  t0: 0.0
  spherical_power: 1.2
  uniform_stride: 2
  normalize_mode: max_abs
  normalize_scope: global
  include_mask_channel: true   # Concatenate missing mask as a second input channel.
  patch_normalize: true
  patch_norm_eps: 1.0e-6
  patch_time: 64               # time axis (must be divisible by patch_size)
  patch_trace: 64              # trace axis (must be divisible by patch_size)
  patch_overlap: 0.5
  max_shots: null              # set int for quick debug
  # skip: []                    # optional: list steps to skip

model:
  type: hf_vit_interpolator
  params:
    in_channels: 2             # 2 when include_mask_channel=true, 1 when false

    # ── Pretrained weight source ──────────────────────────────────────
    # Three loading modes (controlled by pretrained + model_name):
    #
    # 1) HuggingFace Hub (default):
    #    pretrained: true
    #    model_name: google/vit-base-patch16-224-in21k
    #
    # 2) Local weights directory:
    #    pretrained: true
    #    model_name: /data/models/my_vit_checkpoint
    #    # Any path starting with / . .. or ~ is auto-detected as local.
    #
    # 3) Random initialisation (offline, no network):
    #    pretrained: false
    #    # Builds a small ViTConfig (192 hidden, 4 layers, 3 heads).
    #    # model_name is ignored in this mode.
    # ──────────────────────────────────────────────────────────────────
    model_name: google/vit-base-patch16-224-in21k
    pretrained: true
    patch_size: 16             # patch_time and patch_trace must be divisible by this
    freeze_encoder: false      # true = only train channel adapter + unpatch head

loss:
  type: mse
  params:
    reduction: mean

metrics:
  - name: snr
    params: { reduction: per_sample }
  - name: psnr
    params: { data_range: 1.0, reduction: per_sample }
  - name: ssim
    params: { data_range: 2.0, window_size: 11, sigma: 1.5 }
  - name: mse
    params: {}

optim:
  type: adamw
  params:
    lr: 1.0e-5                 # lower lr for pretrained encoder
    weight_decay: 1.0e-4

scheduler:
  type: cosine
  params:
    min_lr: 1.0e-6

train:
  epochs: 200
  grad_clip: 1.0
  log_step: false
  log_interval: 20
  eval_interval: 1
  ckpt_interval: 20
  vis_interval: 5
  resume: null

log:
  log_dir: logs
  plot_interval: 5

inference:
  data:
    segy:
      path: /NAS/czt/mount/chengzhitong/data/SEGC3/SEG_45Shot_shots10-18.sgy
      traces_per_shot: 201
      time_downsample: 1
  checkpoint: results/interp_hf_vit_base/checkpoints/epoch_0199.pt
  output_dir: results/interp_hf_vit_base/inference
  n_viz_shots: 5
  device: 1
  batch_size: 4
