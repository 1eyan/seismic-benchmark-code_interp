experiment:
  name: interp_avo_wu2024_spnet_base
  output_dir: results
  seed: 42
  device: cuda

#  "The shared benchmark uses 128 x 256 patches instead of the paper's 128 x 128 patches." 
#  "Training batch size is reduced from 16 to 8 so the number of samples per update matches the paper after doubling patch width."
#  "The shared benchmark uses max-absolute normalization and optional visible-patch scaling instead of the paper's per-sample min-max normalization." 
#  "The benchmark loader returns input-target pairs only, so the model infers whole-trace masks from zero-filled input unless an explicit observed-data mask is supplied."

data:
  segy:
    path: /home/data/gw/seismic.segy
    traces_per_shot: 120
    time_downsample: 1
  # npy:
  #   path: /data/shared/SEGC3/SEG_45Shot_shots1-9.npy
  # mat:
  #   path: /data/shared/SEGC3/SEG_45Shot_shots1-9.mat
  #   key: shots   # optional variable name
  # Shot-level split: uncomment to split by FFID instead of patch-level random split.
  # When present, test_ratio is ignored. Splits are performed on unique FFID values
  # in sequential order (first N FFIDs -> train, next M -> val, remaining -> test).
  shot_split:
    train: 801
    val: 100
    test: 100
  # test_ratio: 0.1
  loader:
    # Paper-equivalent pixel count: 16 x 128 x 128 = 8 x 128 x 256.
    batch_size: 32
    num_workers: 4
    pin_memory: true

preprocess:
  mask_mode: continuous
  mask_ratio: 0.1
  # continuous_missing_traces: 20
  dt: 0.004
  t0: 0.0
  spherical_power: 0
  uniform_stride: 2
  normalize_mode: max_abs
  normalize_scope: global
  patch_normalize: true
  patch_norm_eps: 1.0e-6
  patch_time: 256
  patch_trace: 120
  patch_overlap: 0.5
  max_shots: null
  # skip: ["spherical_divergence_correction", "normalize", "mask_traces"]

model:
  type: spnet
  params:
    in_channels: 1
    out_channels: 1
    features: 64
    phases: 9
    kernel_size: 3
    threshold_init: 0.01
    mask_eps: 1.0e-8

loss:
  type: spnet_composite
  params:
    symmetry_weight: 0.01
    reduction: mean

metrics:
  - name: snr
    params: { reduction: per_sample }
  - name: psnr
    params: { data_range: 1.0, reduction: per_sample }
  - name: ssim
    params: { data_range: 2.0, window_size: 11, sigma: 1.5 }
  - name: mse
    params: {}

optim:
  type: adam
  params:
    lr: 1.0e-4

scheduler:
  type: step
  params:
    step_size: 10
    gamma: 0.9

train:
  epochs: 100
  grad_clip: null
  log_step: false
  log_interval: 20
  eval_interval: 1
  ckpt_interval: 10
  vis_interval: 5
  resume: null

log:
  log_dir: logs
  plot_interval: 5

inference:
  data:
    segy:
      path: /home/data/gw/seismic.segy 
      traces_per_shot: 120
      time_downsample: 1
  checkpoint: results/interp_spnet_base_continuous_miss20/checkpoints/best.pt
  output_dir: results/interp_spnet_base_continuous_miss20/inference
  n_viz_shots: 5
  device: cuda:1
  batch_size: 16
