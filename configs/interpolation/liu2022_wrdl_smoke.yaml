# ---------------------------------------------------------------------------
# Liu et al. 2022 — WRDL smoke test (dataflow / loss / checkpoint verification)
#
# 2 epochs, tiny model (2 levels, 8-16 channels), batch 2, 1 shot only.
# NOT for performance evaluation.
# ---------------------------------------------------------------------------

experiment:
  name: interp_liu2022_wrdl_smoke
  output_dir: results
  seed: 42
  device: cuda

data:
  segy:
    path: /NAS/czt/mount/chengzhitong/data/SEGC3/SEG_45Shot_shots1-9.sgy
    traces_per_shot: 201
    time_downsample: 1
  test_ratio: 0.1
  loader:
    batch_size: 2
    num_workers: 2
    pin_memory: true

preprocess:
  mask_mode: continuous
  mask_ratio: 0.2
  dt: 0.002
  t0: 0.0
  spherical_power: 1.2
  normalize_mode: max_abs
  normalize_scope: global
  patch_time: 64
  patch_trace: 64
  patch_overlap: 0.0
  max_shots: 1
  skip: []

model:
  type: liu2022_wrdl
  params:
    in_channels: 1
    out_channels: 1
    encoder_channels: [8, 16]     # tiny: 2 levels only
    bottleneck_channels: 16
    bottleneck_blocks: 1
    bottleneck_ratio: 4
    wavelet: haar
    subband_order: ll_lh_hl_hh
    output_activation: none

loss:
  type: wrdl_ssim_huber
  params:
    ssim_weight: 1.0
    huber_weight: 1.0
    huber_delta: 1.0
    window_size: 11
    window_sigma: 1.5
    data_range: 2.0

metrics:
  - name: snr
    params: { reduction: per_sample }
  - name: mae
    params: {}

optim:
  type: adam
  params:
    lr: 1.0e-3

scheduler:
  type: cosine
  params:
    min_lr: 1.0e-6

train:
  epochs: 2
  eval_interval: 1
  ckpt_interval: 1
  vis_interval: 1
  log_interval: 5
  log_step: true

log:
  log_dir: logs
  plot_interval: 1
