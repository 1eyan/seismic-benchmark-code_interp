# ---------------------------------------------------------------------------
# Liu et al. 2022 — WRDL conservative profile
#
# Paper: "Seismic Data Reconstruction via Wavelet-Based Residual Deep Learning",
#         IEEE TGRS, vol. 60, 2022, article 4508213.
# DOI:  10.1109/TGRS.2022.3152984
#
# CONSERVATIVE PROFILE — NOT paper-aligned.  The paper PDF could not be accessed
# independently.  All parameters below are reproduction-assumption unless
# otherwise noted.  Once the paper is audited, rename or replace with a verified
# paper.yaml.
# ---------------------------------------------------------------------------

experiment:
  name: interp_liu2022_wrdl_conservative
  output_dir: /cloud/cloud-s3fs
  seed: 42
  device: cuda:0

data:
  segy:
    path: /cloud/cloud-s3fs/seismic_shotper0.8.segy
    traces_per_shot: 120
    time_downsample: 1
  test_ratio: 0.1
  loader:
    batch_size: 128           # paper-inferred (matching ANet field profile)
    num_workers: 4
    pin_memory: true


preprocess:
  mask_mode: continuous
  mask_ratio: 0.1
  dt: 0.002
  t0: 0.0
  spherical_power: 1.2
  uniform_stride: 2
  normalize_mode: max_abs
  normalize_scope: global
  patch_normalize: true
  patch_norm_eps: 1.0e-6
  patch_time: 256
  patch_trace: 120
  patch_overlap: 0.5
  max_shots: null

model:
  type: liu2022_wrdl
  params:
    in_channels: 1
    out_channels: 1
    encoder_channels: [32, 64, 128, 256, 512]   # reproduction-assumption
    bottleneck_channels: 512                     # reproduction-assumption
    bottleneck_blocks: 2                         # reproduction-assumption
    bottleneck_ratio: 4                          # reproduction-assumption
    wavelet: haar                                # reproduction-assumption
    subband_order: ll_lh_hl_hh
    output_activation: none                      # regression task

loss:
  type: wrdl_ssim_huber
  params:
    ssim_weight: 1.0          # reproduction-assumption
    huber_weight: 1.0         # reproduction-assumption
    huber_delta: 1.0          # reproduction-assumption
    window_size: 11           # reproduction-assumption
    window_sigma: 1.5         # reproduction-assumption
    data_range: 2.0           # [-1, 1] → range 2

metrics:
  - name: snr
    params: { reduction: per_sample }
  - name: ssim
    params: { data_range: 2.0, window_size: 11, sigma: 1.5 }
  - name: mae
    params: {}
  - name: mse
    params: {}

optim:
  type: adam
  params:
    lr: 1.0e-3                # reproduction-assumption
    betas: [0.9, 0.999]
    weight_decay: 0.0         # reproduction-assumption

scheduler:
  type: cosine
  params:
    min_lr: 1.0e-6

train:
  epochs: 100                 # reproduction-assumption
  eval_interval: 2
  ckpt_interval: 10
  vis_interval: 10
  log_interval: 20
  log_step: false
  grad_clip: 1.0              # reproduction-assumption

log:
  log_dir: logs
  plot_interval: 5

paper_alignment:
  model_name: paper-explicit (WRDL)
  backbone: paper-explicit (U-Net)
  dwt_replaces_pooling: paper-explicit
  iwt_with_expansion_conv: paper-explicit
  residual_blocks: paper-explicit
  bottleneck_residual: paper-explicit (keyword)
  ssim_huber_loss: paper-explicit
  irregular_missing_experiment: paper-explicit
  consecutive_missing_experiment: paper-explicit
  encoder_channels: reproduction-assumption
  num_levels: reproduction-assumption
  wavelet_basis: reproduction-assumption (unresolved)
  subband_order: reproduction-assumption (unresolved)
  bottleneck_blocks: reproduction-assumption (unresolved)
  bottleneck_ratio: reproduction-assumption (unresolved)
  huber_delta: reproduction-assumption (unresolved)
  ssim_weight: reproduction-assumption (unresolved)
  huber_weight: reproduction-assumption (unresolved)
  ssim_window_size: reproduction-assumption (unresolved)
  learning_rate: reproduction-assumption (unresolved)
  batch_size: reproduction-assumption (unresolved)
  epochs: reproduction-assumption (unresolved)
  patch_size: reproduction-assumption (unresolved)
  optimizer: reproduction-assumption (unresolved)
  data_normalization: repository-adaptation
  output_activation: reproduction-assumption
  odd_size_padding: repository-adaptation
