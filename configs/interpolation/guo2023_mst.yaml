# ---------------------------------------------------------------------------
# Guo et al. 2023 — Multi-Scale Transformer for seismic interpolation
#
# The MST generates multi-scale seismic feature maps, applies independent
# self-attention at each scale to capture long-range dependencies, then
# fuses multi-scale features into a complete reconstruction.
#
# This is a conservative reproduction profile.
# The paper-explicit component is multi-scale self-attention over
# multi-scale seismic feature maps.
# Exact scale count, embedding dimensions, transformer depth, head count,
# tokenization, positional encoding and fusion must be replaced when
# verified from the original paper.
# ---------------------------------------------------------------------------

experiment:
  name: interp_guo2023_mst_conservative
  output_dir: results
  seed: 42
  device: cuda

data:
  segy:
    path: /NAS/czt/mount/chengzhitong/data/SEGC3/SEG_45Shot_shots1-9.sgy
    traces_per_shot: 201
    time_downsample: 1
  test_ratio: 0.1
  loader:
    batch_size: 192
    num_workers: 4
    pin_memory: true

preprocess:
  mask_mode: continuous
  mask_ratio: 0.1
  dt: 0.002
  t0: 0.0
  spherical_power: 1.2
  uniform_stride: 2
  normalize_mode: max_abs
  normalize_scope: global
  patch_normalize: true
  patch_norm_eps: 1.0e-6
  patch_time: 256
  patch_trace: 128
  patch_overlap: 0.5
  max_shots: null

model:
  type: guo2023_mst
  params:
    in_channels: 1
    out_channels: 1
    num_scales: 3
    embed_dims: [32, 64, 128]
    depths: [1, 1, 1]
    num_heads: [4, 4, 8]
    mlp_ratio: 4.0
    kernel_size: 3
    downsample_mode: stride_conv
    upsample_mode: bilinear
    norm_type: layer
    activation: gelu
    positional_encoding: none
    dropout: 0.0
    attention_dropout: 0.0
    drop_path: 0.0
    output_mode: direct
    max_tokens_per_scale: null

loss:
  type: mse
  params:
    reduction: mean

metrics:
  - name: snr
    params: { reduction: per_sample }
  - name: psnr
    params: { data_range: 1.0, reduction: per_sample }
  - name: ssim
    params: { data_range: 2.0, window_size: 11, sigma: 1.5 }
  - name: mse
    params: {}

optim:
  type: adamw
  params:
    lr: 1.0e-3
    weight_decay: 1.0e-4

scheduler:
  type: cosine
  params:
    min_lr: 1.0e-6

train:
  epochs: 200
  grad_clip: 1.0
  log_step: false
  log_interval: 20
  eval_interval: 1
  ckpt_interval: 5
  vis_interval: 5
  resume: null

log:
  log_dir: logs
  plot_interval: 5

inference:
  data:
    segy:
      path: /NAS/czt/mount/chengzhitong/data/SEGC3/SEG_45Shot_shots10-18.sgy
      traces_per_shot: 201
      time_downsample: 1
  checkpoint: results/interp_guo2023_mst_conservative/checkpoints/epoch_0059.pt
  output_dir: results/interp_guo2023_mst_conservative/inference
  n_viz_shots: 5
  device: 1
  batch_size: 4
