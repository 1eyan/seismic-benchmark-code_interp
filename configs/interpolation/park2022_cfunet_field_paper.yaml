# ---------------------------------------------------------------------------
# Park et al. 2022 — CFunet paper-aligned configuration (field profile)
#
# Paper: "Coarse-Refine Network With Upsampling Techniques and Fourier Loss
#         for the Reconstruction of Missing Seismic Data"
#        IEEE TGRS, vol. 60, 2022, art. 5917615.
# DOI:  10.1109/TGRS.2022.3190292
#
# Field profile: alpha = 0.1 (paper Table II), Adam lr = 1e-5, 128x120
# patches, Mobil AVO Viking Graben data (paper uses the same dataset, with a
# low-pass filter below 62.5 Hz).  All other settings and classifications
# inherited from park2022_cfunet_paper.yaml.  The in-repo Mobil AVO volume
# stands in for the paper's preprocessed field data (repository adaptation).
# ---------------------------------------------------------------------------

experiment:
  name: interp_park2022_cfunet_field_paper
  output_dir: results
  seed: 42
  device: cuda:1

data:
  segy:
    path: /NAS/czt/mount/chengzhitong/data/MobilAVO_Viking_Graben/mobil_avo_viking_graben.sgy
    traces_per_shot: 120
    time_downsample: 1
  test_ratio: 0.1
  loader:
    batch_size: 32          # paper-explicit
    num_workers: 4
    pin_memory: true

preprocess:
  mask_mode: cfunet_random
  mask_ratio_range: [0.5, 0.875]   # paper-explicit (train missing ratio)
  dt: 0.004
  t0: 0.0
  spherical_power: 1.2
  normalize_mode: max_abs
  normalize_scope: global
  patch_normalize: true
  patch_norm_eps: 1.0e-6
  patch_time: 128          # paper-explicit patch size (field, 128 x 120)
  patch_trace: 120
  patch_overlap: 0.5
  max_shots: null

model:
  type: park2022_cfunet
  params:
    in_channels: 1
    out_channels: 1
    base_channels: 22      # paper-explicit (22 -> 44 -> 88 -> 176)
    num_levels: 4          # paper-explicit (bottleneck 352)
    upsample_mode: fourier_zero_padding   # paper-explicit (Eqs. 3-4)
    upsampler_scale_factor: 2             # paper-explicit (x2 both axes)
    use_fftshift: true
    fft_norm: backward                    # reproduction-assumption
    amplitude_correction: scale           # reproduction-assumption

loss:
  type: cfunet_mse_fourier
  params:
    alpha: 0.1             # paper-explicit (field, Table II)
    fft_norm: backward     # reproduction-assumption

metrics:
  - name: snr
    params: { reduction: per_sample }
  - name: ssim
    params: { data_range: 2.0, window_size: 11, sigma: 1.5 }
  - name: mae
    params: {}
  - name: mse
    params: {}

optim:
  type: adam
  params:
    lr: 1.0e-5             # paper-explicit (field)
    betas: [0.9, 0.999]
    weight_decay: 0.0

scheduler:
  type: none
  params: {}

train:
  epochs: 20               # paper-explicit (up to 20 epochs)
  eval_interval: 1
  ckpt_interval: 5
  vis_interval: 5
  log_interval: 20
  log_step: false
  grad_clip: null

log:
  log_dir: logs
  plot_interval: 1

paper_alignment:
  model_name: paper-explicit (CFunet)
  alpha_field: paper-explicit (0.1, Table II)
  learning_rate: paper-explicit (1e-5 field)
  patch_size: paper-explicit (128 x 120)
  dataset: repository-adaptation (in-repo Mobil AVO volume; paper applies a
    62.5 Hz low-pass filter before patching — not reproduced here)
  low_pass_filter: not-reproduced (paper applies 62.5 Hz low-pass filter)
  other: inherited from park2022_cfunet_paper.yaml paper_alignment block
