# ---------------------------------------------------------------------------
# Wang et al. 2019 — Paper-aligned training configuration
#
# Paper: "Deep-learning-based seismic data interpolation: A preliminary result."
#        Geophysics, vol. 84, no. 1, pp. V11-V20, 2019.
# DOI:  10.1190/geo2017-0495.1
#
# The paper-explicit fact is an 8-layer 2D residual CNN for regular-missing
# trace interpolation.  Virtually all training hyperparameters are
# reproduction-assumptions — the paper describes a preliminary result and
# lacks detailed training recipes.  This config uses a conservative profile
# consistent with the paper's era (2017-2019) and small 223K-param model.
# ---------------------------------------------------------------------------

experiment:
  name: interp_wang2019_resnet_paper
  output_dir: results
  seed: 42
  device: cuda

data:
  segy:
    path: /NAS/czt/mount/chengzhitong/data/SEGC3/SEG_45Shot_shots1-9.sgy
    traces_per_shot: 201
    time_downsample: 1
  test_ratio: 0.1
  loader:
    batch_size: 192
    num_workers: 4
    pin_memory: true

preprocess:
  mask_mode: continuous
  mask_ratio: 0.5
  dt: 0.002
  t0: 0.0
  spherical_power: 1.2
  uniform_stride: 2
  normalize_mode: max_abs
  normalize_scope: global
  patch_time: 256
  patch_trace: 128
  patch_overlap: 0.5
  max_shots: null

model:
  type: wang2019_resnet
  params:
    in_channels: 1
    out_channels: 1
    features: 64
    num_blocks: 3
    kernel_size: 3
    activation: relu
    norm: none
    output_mode: direct
    conv_bias: true
    dropout: 0.0
    num_groups: 8

loss:
  type: mse
  params:
    reduction: mean

metrics:
  - name: snr
    params: { reduction: per_sample }
  - name: psnr
    params: { data_range: 1.0, reduction: per_sample }
  - name: ssim
    params: { data_range: 2.0, window_size: 11, sigma: 1.5 }
  - name: mse
    params: {}

optim:
  type: adam
  params:
    lr: 1.0e-3

scheduler:
  type: step
  params:
    step_size: 30
    gamma: 0.5

train:
  epochs: 100
  grad_clip: null
  log_step: false
  log_interval: 20
  eval_interval: 1
  ckpt_interval: 5
  vis_interval: 5
  resume: null

log:
  log_dir: logs
  plot_interval: 5

inference:
  data:
    segy:
      path: /NAS/czt/mount/chengzhitong/data/SEGC3/SEG_45Shot_shots10-18.sgy
      traces_per_shot: 201
      time_downsample: 1
  checkpoint: results/interp_wang2019_resnet_paper/checkpoints/best.pt
  output_dir: results/interp_wang2019_resnet_paper/inference
  n_viz_shots: 5
  device: 1
  batch_size: 4

# ---------------------------------------------------------------------------
# Paper alignment audit
# ---------------------------------------------------------------------------
paper_alignment:
  architecture:
    num_layers:        { classification: paper-explicit,    value: 8,                   evidence: "Paper title and description: '8-layer residual CNN'" }
    residual_blocks:   { classification: paper-explicit,    value: 3,                   evidence: "8 layers = 1 stem + 3×2 block convs + 1 output" }
    features:          { classification: reproduction-assumption, value: 64,            evidence: "Not verified from paper; conservative default" }
    kernel_size:       { classification: reproduction-assumption, value: 3,             evidence: "Not verified from paper; 3×3 is standard" }
    activation:        { classification: reproduction-assumption, value: relu,          evidence: "Not verified from paper" }
    norm:              { classification: reproduction-assumption, value: none,          evidence: "Paper predates widespread BN in this domain (2017-2019)" }
    output_mode:       { classification: reproduction-assumption, value: direct,        evidence: "Not verified whether global residual is used" }
  training:
    loss:              { classification: reproduction-assumption, value: mse,           evidence: "Standard L2 for regression; paper loss not verified" }
    optimizer:         { classification: reproduction-assumption, value: adam,          evidence: "Common optimizer for 2019 era; not verified from paper" }
    lr:                { classification: reproduction-assumption, value: 1.0e-3,        evidence: "Default Adam LR; not verified from paper" }
    batch_size:        { classification: reproduction-assumption, value: 192,           evidence: "Not verified from paper" }
    epochs:            { classification: reproduction-assumption, value: 100,           evidence: "Conservative for small 223K-param model; not verified" }
    scheduler:         { classification: reproduction-assumption, value: step,          evidence: "Step decay is era-appropriate (2019); not verified" }
    grad_clip:         { classification: reproduction-assumption, value: null,          evidence: "Not mentioned in available excerpts" }
