experiment:
  name: interp_trace_token_transformer
  output_dir: results       # Relative to repo root, or absolute (e.g., /data/experiments)
  seed: 42
  device: cuda

data:
  # Supported formats: segy, npy, mat (pick one block)
  segy:
    path: /cloud/cloud-s3fs/SEGC3/SEG_45Shot_shots1-9.sgy
    traces_per_shot: 201
    time_downsample: 1
  # npy:
  #   path: /data/shared/SEGC3/SEG_45Shot_shots1-9.npy
  # mat:
  #   path: /data/shared/SEGC3/SEG_45Shot_shots1-9.mat
  #   key: shots   # optional variable name
  # Shot-level split: uncomment to split by FFID instead of patch-level random split.
  # shot_split:
  #   train: 7
  #   val: 1
  #   test: 1
  test_ratio: 0.1
  loader:
    batch_size: 32
    num_workers: 4
    pin_memory: true

preprocess:
  mask_mode: continuous
  mask_ratio: 0.1
  # continuous_missing_traces: 20
  dt: 0.002
  t0: 0.0
  spherical_power: 1.2
  uniform_stride: 2
  normalize_mode: max_abs
  normalize_scope: global
  include_mask_channel: true   # Concatenate missing mask as a second input channel.
  patch_normalize: true
  patch_norm_eps: 1.0e-6
  patch_time: 64               # time axis (must match model.trace_length)
  patch_trace: 32              # trace axis (number of tokens per patch)
  patch_overlap: 0.5
  max_shots: null              # set int for quick debug
  # skip: []                    # optional: list steps to skip

model:
  type: trace_token_transformer_interpolator
  params:
    in_channels: 2             # 2 when include_mask_channel=true, 1 when false
    trace_length: 64           # must match preprocess.patch_time
    embed_dim: 256
    encoder_depth: 6
    decoder_depth: 4
    num_heads: 8
    dropout: 0.0
    pos_encoding: sincos
    coord_dim: 1               # reserved for future 5D coordinate extension

loss:
  type: mse
  params:
    reduction: mean

metrics:
  - name: snr
    params: { reduction: per_sample }
  - name: psnr
    params: { data_range: 1.0, reduction: per_sample }
  - name: ssim
    params: { data_range: 2.0, window_size: 11, sigma: 1.5 }
  - name: mse
    params: {}

optim:
  type: adamw
  params:
    lr: 1.0e-4
    weight_decay: 1.0e-4

scheduler:
  type: cosine
  params:
    min_lr: 1.0e-6

train:
  epochs: 200
  grad_clip: 1.0
  log_step: false
  log_interval: 20
  eval_interval: 1
  ckpt_interval: 20
  vis_interval: 5
  resume: null

log:
  log_dir: logs
  plot_interval: 5

inference:
  data:
    segy:
      path: /cloud/cloud-s3fs/SEGC3/SEG_45Shot_shots10-18.sgy
      traces_per_shot: 201
      time_downsample: 1
  checkpoint: results/interp_trace_token_transformer/checkpoints/epoch_0199.pt
  output_dir: results/interp_trace_token_transformer/inference
  n_viz_shots: 5
  device: 1
  batch_size: 4
