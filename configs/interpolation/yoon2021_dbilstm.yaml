# ---------------------------------------------------------------------------
# Yoon et al. 2021 — DBiLSTM with skip connections for seismic interpolation
#
# The native paper model is trace-to-trace: [B, T, 2] -> [B, T, 1].
# ``regular_midpoint_4d`` is a repository adapter that vectorizes midpoint
# prediction over a 2D gather without changing the trainer.
#
# Conservative reproduction profile:
#   3 BiLSTM layers, hidden [64, 128, 128], dropout 0.2,
#   projected additive skip, 727,553 trainable parameters.
# ---------------------------------------------------------------------------

experiment:
  name: interp_yoon2021_dbilstm_profile
  output_dir: results
  seed: 42
  device: cuda

data:
  segy:
    path: /NAS/czt/mount/chengzhitong/data/SEGC3/SEG_45Shot_shots1-9.sgy
    traces_per_shot: 201
    time_downsample: 1
  test_ratio: 0.1
  loader:
    batch_size: 192
    num_workers: 4
    pin_memory: true

preprocess:
  mask_mode: uniform
  mask_ratio: 0.1
  dt: 0.002
  t0: 0.0
  spherical_power: 1.2
  uniform_stride: 2
  normalize_mode: max_abs
  normalize_scope: global
  patch_normalize: true
  patch_norm_eps: 1.0e-6
  patch_time: 256
  patch_trace: 128
  patch_overlap: 0.5
  max_shots: null

model:
  type: yoon2021_dbilstm
  params:
    input_mode: regular_midpoint_4d
    hidden_sizes: [64, 128, 128]
    dropout: 0.2
    use_skip: true
    target_stride: 2
    target_offset: 1
    spatial_chunk_size: 64

loss:
  type: mse
  params:
    reduction: mean

metrics:
  - name: snr
    params: { reduction: per_sample }
  - name: psnr
    params: { data_range: 1.0, reduction: per_sample }
  - name: ssim
    params: { data_range: 2.0, window_size: 11, sigma: 1.5 }
  - name: mse
    params: {}

optim:
  type: adamw
  params:
    lr: 1.0e-3
    weight_decay: 1.0e-4

scheduler:
  type: cosine
  params:
    min_lr: 1.0e-6

train:
  epochs: 200
  grad_clip: 1.0
  log_step: false
  log_interval: 20
  eval_interval: 1
  ckpt_interval: 5
  vis_interval: 5
  resume: null

log:
  log_dir: logs
  plot_interval: 5

inference:
  data:
    segy:
      path: /NAS/czt/mount/chengzhitong/data/SEGC3/SEG_45Shot_shots10-18.sgy
      traces_per_shot: 201
      time_downsample: 1
  checkpoint: results/interp_yoon2021_dbilstm_profile/checkpoints/epoch_0059.pt
  output_dir: results/interp_yoon2021_dbilstm_profile/inference
  n_viz_shots: 5
  device: 1
  batch_size: 4
