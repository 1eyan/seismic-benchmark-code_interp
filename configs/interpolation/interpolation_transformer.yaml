experiment:
  name: interp_transformer_v9
  output_dir: results
  seed: 42
  device: cuda

data:
  segy:
    path: /NAS/czt/mount/chengzhitong/data/SEGC3/SEG_45Shot_shots1-9.sgy
    traces_per_shot: 201
    time_downsample: 1
  test_ratio: 0.1
  loader:
    batch_size: 12
    num_workers: 4
    pin_memory: true

preprocess:
  mask_mode: continuous
  mask_ratio: 0.1
  dt: 0.002
  t0: 0.0
  spherical_power: 1.2
  normalize_mode: max_abs
  normalize_scope: global
  max_shots: null
  # Transformer 专属参数
  chunk_length: 256
  overlap_ratio: 0.125

# -------------------------------------------------------
# Model selection: uncomment the variant you want to use.
# Default: V11 Encoder-Decoder (cross-attention decoder)
# -------------------------------------------------------
model:
  type: gated_transformer_v9
  params:
    input_dim: 256
    d_model: 768
    n_heads: 8
    num_layers: 8
    d_ff: 2048
    dropout: 0.1
    norm_type: rms
    use_rope: true
    use_coord_encoding: true
    coord_dim: 6
    #encode_observed_only: true
    use_qk_norm: true
    qkv_bias: false
    hidden_act: gelu
    num_attn_res_blocks: 2
    use_attn_res: true
    #use_data_embedding: true
    #embed_type: 

# V11 original (self-attention decoder)
# model:
#   type: gated_transformer_v11
#   params:
#     input_dim: 256
#     d_model: 512
#     n_heads: 8
#     num_layers: 4
#     d_ff: 2048
#     dropout: 0.1
#     norm_type: rms
#     use_rope: true
#     use_coord_encoding: true
#     coord_dim: 6
#     use_qk_norm: false
#     use_attn_res: false
#     use_data_embedding: false

# V9 Encoder-Decoder (Block Attention Residuals + cross-attention)
# model:
#   type: gated_transformer_v9_encdec
#   params:
#     input_dim: 256
#     d_model: 512
#     n_heads: 8
#     num_encoder_layers: 4
#     num_decoder_layers: 4
#     d_ff: 2048
#     dropout: 0.1
#     norm_type: rms
#     use_rope: true
#     coord_dim: 6
#     encode_observed_only: true
#     num_attn_res_blocks: 2

# V9 original (self-attention decoder)
# model:
#   type: gated_transformer_v9
#   params:
#     input_dim: 256
#     d_model: 512
#     n_heads: 8
#     num_layers: 4
#     d_ff: 2048
#     dropout: 0.1
#     norm_type: rms
#     use_rope: true
#     coord_dim: 6
#     use_attn_res: false
# -------------------------------------------------------

loss:
  type: mse
  params:
    reduction: mean

metrics:
  - name: snr
    params: { reduction: per_sample }
  - name: psnr
    params: { data_range: 1.0, reduction: per_sample }
  - name: ssim
    params: { data_range: 2.0, window_size: 11, sigma: 1.5 }
  - name: mse
    params: {}

optim:
  type: adamw
  params:
    lr: 1.0e-4
    weight_decay: 1.0e-4

scheduler:
  type: cosine
  params:
    min_lr: 1.0e-6

train:
  epochs: 1000
  grad_clip: 1.0
  log_step: false
  log_interval: 20
  eval_interval: 1
  ckpt_interval: 5
  vis_interval: 5
  resume: null

log:
  log_dir: logs
  plot_interval: 5

inference:
  data:
    segy:
      path: /NAS/czt/mount/chengzhitong/data/SEGC3/SEG_45Shot_shots10-18.sgy
      traces_per_shot: 201
      time_downsample: 1
  checkpoint: null
  output_dir: null
  n_viz_shots: 5
  device: 2
  batch_size: 24
  replace_observed: true  # true=全重建模式（模型输出替代全部道，含观测道）
