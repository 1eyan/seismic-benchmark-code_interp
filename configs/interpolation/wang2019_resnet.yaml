# ---------------------------------------------------------------------------
# Wang et al. 2019 – 8-layer residual CNN for seismic interpolation
#
# This is a conservative reproduction profile.
# Only the two-dimensional 8-layer residual CNN concept is paper-explicit.
# Exact width, kernel, normalization and output residual mode must be updated
# if verified from the original architecture figure.
# ---------------------------------------------------------------------------

experiment:
  name: interp_wang2019_resnet_paper
  output_dir: results
  seed: 42
  device: cuda

data:
  segy:
    path: /NAS/czt/mount/chengzhitong/data/SEGC3/SEG_45Shot_shots1-9.sgy
    traces_per_shot: 201
    time_downsample: 1
  test_ratio: 0.1
  loader:
    batch_size: 192
    num_workers: 4
    pin_memory: true

preprocess:
  mask_mode: continuous
  mask_ratio: 0.1
  dt: 0.002
  t0: 0.0
  spherical_power: 1.2
  uniform_stride: 2
  normalize_mode: max_abs
  normalize_scope: global
  patch_normalize: true
  patch_norm_eps: 1.0e-6
  patch_time: 256
  patch_trace: 128
  patch_overlap: 0.5
  max_shots: null

model:
  type: wang2019_resnet
  params:
    in_channels: 1
    out_channels: 1
    features: 64
    num_blocks: 3
    kernel_size: 3
    activation: relu
    norm: none
    output_mode: direct
    conv_bias: true
    dropout: 0.0
    num_groups: 8

loss:
  type: mse
  params:
    reduction: mean

metrics:
  - name: snr
    params: { reduction: per_sample }
  - name: psnr
    params: { data_range: 1.0, reduction: per_sample }
  - name: ssim
    params: { data_range: 2.0, window_size: 11, sigma: 1.5 }
  - name: mse
    params: {}

optim:
  type: adamw
  params:
    lr: 1.0e-3
    weight_decay: 1.0e-4

scheduler:
  type: cosine
  params:
    min_lr: 1.0e-6

train:
  epochs: 200
  grad_clip: 1.0
  log_step: false
  log_interval: 20
  eval_interval: 1
  ckpt_interval: 5
  vis_interval: 5
  resume: null

log:
  log_dir: logs
  plot_interval: 5

inference:
  data:
    segy:
      path: /NAS/czt/mount/chengzhitong/data/SEGC3/SEG_45Shot_shots10-18.sgy
      traces_per_shot: 201
      time_downsample: 1
  checkpoint: results/interp_wang2019_resnet_paper/checkpoints/epoch_0200.pt
  output_dir: results/interp_wang2019_resnet_paper/inference
  n_viz_shots: 5
  device: 1
  batch_size: 4
