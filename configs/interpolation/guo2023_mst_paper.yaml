# ---------------------------------------------------------------------------
# Guo et al. 2023 — Paper-aligned training configuration
#
# Paper: "Seismic Data Interpolation Based on Multi-Scale Transformer."
#        IEEE GRSL, vol. 20, art. 7505905, 2023.
# DOI:  10.1109/LGRS.2023.3298101
#
# The paper-explicit component is multi-scale self-attention over seismic
# feature maps.  The paper is behind IEEE paywall; architecture details and
# ALL training hyperparameters are reproduction-assumptions based on
# standard vision transformer practice (2022-2023 era).
#
# Key design: trace-wise random 50% missing, small patches (96×96),
# AdamW with cosine to 1e-6, data augmentation (horizontal flip,
# spatial downsampling).
# ---------------------------------------------------------------------------

experiment:
  name: interp_guo2023_mst_paper
  output_dir: results
  seed: 42
  device: cuda

data:
  segy:
    path: /NAS/czt/mount/chengzhitong/data/SEGC3/SEG_45Shot_shots1-9.sgy
    traces_per_shot: 201
    time_downsample: 1
  test_ratio: 0.1
  loader:
    batch_size: 32
    num_workers: 4
    pin_memory: true

preprocess:
  mask_mode: random
  mask_ratio: 0.5
  dt: 0.002
  t0: 0.0
  spherical_power: 1.2
  uniform_stride: 2
  normalize_mode: max_abs
  normalize_scope: global
  patch_time: 96
  patch_trace: 96
  patch_overlap: 0.5
  max_shots: null

model:
  type: guo2023_mst
  params:
    in_channels: 1
    out_channels: 1
    num_scales: 3
    embed_dims: [32, 64, 128]
    depths: [1, 1, 1]
    num_heads: [4, 4, 8]
    mlp_ratio: 4.0
    kernel_size: 3
    downsample_mode: stride_conv
    upsample_mode: bilinear
    norm_type: layer
    activation: gelu
    positional_encoding: none
    dropout: 0.0
    attention_dropout: 0.0
    drop_path: 0.0
    output_mode: direct
    max_tokens_per_scale: null

loss:
  type: mse
  params:
    reduction: mean

metrics:
  - name: snr
    params: { reduction: per_sample }
  - name: psnr
    params: { data_range: 1.0, reduction: per_sample }
  - name: ssim
    params: { data_range: 2.0, window_size: 11, sigma: 1.5 }
  - name: mse
    params: {}

optim:
  type: adamw
  params:
    lr: 1.0e-4
    weight_decay: 1.0e-4

scheduler:
  type: cosine
  params:
    min_lr: 1.0e-6

train:
  epochs: 80
  grad_clip: null
  log_step: false
  log_interval: 20
  eval_interval: 1
  ckpt_interval: 5
  vis_interval: 5
  resume: null

log:
  log_dir: logs
  plot_interval: 5

inference:
  data:
    segy:
      path: /NAS/czt/mount/chengzhitong/data/SEGC3/SEG_45Shot_shots10-18.sgy
      traces_per_shot: 201
      time_downsample: 1
  checkpoint: results/interp_guo2023_mst_paper/checkpoints/best.pt
  output_dir: results/interp_guo2023_mst_paper/inference
  n_viz_shots: 5
  device: 1
  batch_size: 1

# ---------------------------------------------------------------------------
# Paper alignment audit
# ---------------------------------------------------------------------------
paper_alignment:
  architecture:
    multi_scale_attn:  { classification: paper-explicit,    value: true,                evidence: "Title and abstract: multi-scale self-attention" }
    num_scales:        { classification: reproduction-assumption, value: 3,             evidence: "Not verified from paper (paywall)" }
    embed_dims:        { classification: reproduction-assumption, value: [32, 64, 128], evidence: "Not verified from paper" }
    depths:            { classification: reproduction-assumption, value: [1, 1, 1],     evidence: "Not verified from paper" }
    num_heads:         { classification: reproduction-assumption, value: [4, 4, 8],     evidence: "Not verified from paper" }
    activation:        { classification: reproduction-assumption, value: gelu,          evidence: "Standard for ViT-era transformers; not verified" }
    norm_type:         { classification: reproduction-assumption, value: layer,         evidence: "Pre-LN is standard for ViT; not verified" }
    pos_encoding:      { classification: reproduction-assumption, value: none,          evidence: "Not verified from paper" }
  training:
    loss:              { classification: reproduction-assumption, value: mse,           evidence: "Standard for regression; paper loss not verified (paywall)" }
    optimizer:         { classification: reproduction-assumption, value: adamw,         evidence: "Standard for ViT training (2022-2023); not verified" }
    lr:                { classification: reproduction-assumption, value: 1.0e-4,        evidence: "Typical for transformer models; not verified" }
    weight_decay:      { classification: reproduction-assumption, value: 1.0e-4,        evidence: "Standard AdamW regularisation; not verified" }
    batch_size:        { classification: reproduction-assumption, value: 32,            evidence: "Conservative for multi-scale transformer; not verified" }
    epochs:            { classification: reproduction-assumption, value: 80,            evidence: "Not verified from paper" }
    scheduler:         { classification: reproduction-assumption, value: cosine,        evidence: "Cosine to 1e-6 is standard for ViT; not verified" }
    patch_size:        { classification: reproduction-assumption, value: [96, 96],      evidence: "Smaller patches for attention memory; not verified" }
    mask_mode:         { classification: reproduction-assumption, value: random,        evidence: "Trace-wise random 50% missing; not verified from paper" }
    grad_clip:         { classification: reproduction-assumption, value: null,          evidence: "Not mentioned in available excerpts" }
    augmentation:      { classification: reproduction-assumption, value: none,          evidence: "Horizontal flip / spatial downsampling NOT YET IMPLEMENTED" }
