# ---------------------------------------------------------------------------
# Yuan et al. 2022 — BTN-Mix: Self-supervised with mixed decimation patterns
#
# Paper: "Self-Supervised Learning for Efficient Antialiasing Seismic Data
#         Interpolation." IEEE TGRS, vol. 60, art. 5913819, 2022.
# DOI:  10.1109/TGRS.2022.3167546
#
# BTN-Mix combines BTN-Random's self-supervised loss with a mix-training
# strategy: during training, different decimation patterns (random uniform,
# continuous, etc.) are blended to mitigate aliasing artefacts from any
# single regular missing pattern.
#
# Note: Full mix-training requires a custom data sampler that cycles through
# multiple decimation patterns during training.  This config uses a single
# random mask pattern as a simplified approximation.  The true mix-training
# data pipeline requires further implementation.
# ---------------------------------------------------------------------------

experiment:
  name: interp_yuan2022_btn_mix
  output_dir: results
  seed: 42
  device: cuda

data:
  segy:
    path: /NAS/czt/mount/chengzhitong/data/SEGC3/SEG_45Shot_shots1-9.sgy
    traces_per_shot: 201
    time_downsample: 1
  test_ratio: 0.1
  loader:
    batch_size: 64
    num_workers: 4
    pin_memory: true

preprocess:
  mask_mode: random
  mask_ratio: 0.5
  dt: 0.002
  t0: 0.0
  spherical_power: 1.2
  normalize_mode: max_abs
  normalize_scope: global
  patch_time: 256
  patch_trace: 128
  patch_overlap: 0.5
  return_mask: true
  max_shots: null

model:
  type: yuan2022_btn
  params:
    in_channels: 1
    out_channels: 1
    base_channels: 32
    num_levels: 4
    kernel_size: 3
    encoder_norm: none
    decoder_norm: batch
    activation: relu
    upsample_mode: nearest
    share_branch_weights: true
    conv_bias: true
    negative_slope: 0.01
    num_groups: 8

loss:
  type: normalized_observed_l1
  params:
    eps: 1.0e-6

metrics:
  - name: snr
    params: { reduction: per_sample }
  - name: psnr
    params: { data_range: 1.0, reduction: per_sample }
  - name: ssim
    params: { data_range: 2.0, window_size: 11, sigma: 1.5 }
  - name: mse
    params: {}
  - name: mae
    params: {}

optim:
  type: adam
  params:
    lr: 1.0e-4

scheduler:
  type: cosine
  params:
    min_lr: 1.0e-6

train:
  epochs: 100
  grad_clip: null
  log_step: false
  log_interval: 20
  eval_interval: 1
  ckpt_interval: 5
  vis_interval: 5
  resume: null

log:
  log_dir: logs
  plot_interval: 5

inference:
  data:
    segy:
      path: /NAS/czt/mount/chengzhitong/data/SEGC3/SEG_45Shot_shots10-18.sgy
      traces_per_shot: 201
      time_downsample: 1
  checkpoint: results/interp_yuan2022_btn_mix/checkpoints/best.pt
  output_dir: results/interp_yuan2022_btn_mix/inference
  n_viz_shots: 5
  device: 1
  batch_size: 4

# ---------------------------------------------------------------------------
# Paper alignment audit
# ---------------------------------------------------------------------------
paper_alignment:
  architecture:
    blind_trace:       { classification: paper-explicit,    value: true,                evidence: "Core BTN mechanism" }
    two_branches:      { classification: paper-explicit,    value: true,                evidence: "Network architecture diagram" }
  training:
    loss:              { classification: paper-inferred,    value: normalized_observed_l1, evidence: "Self-supervised L1 on observed positions" }
    mix_training:      { classification: paper-explicit,    value: true,                evidence: "'Mix-Training' in paper; blends decimation patterns" }
    mix_implementation: { classification: unresolved,        value: simplified,          evidence: "Full mix-training data sampler NOT YET IMPLEMENTED; uses single random pattern" }
    optimizer:         { classification: reproduction-assumption, value: adam,          evidence: "Not verified from paper" }
    lr:                { classification: reproduction-assumption, value: 1.0e-4,        evidence: "Not verified from paper" }
    self_supervised:   { classification: paper-explicit,    value: true,                evidence: "Paper title" }
